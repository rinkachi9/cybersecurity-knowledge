<text x='20' y='412' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#4b5563'>Example rules: Patient reads or changes only own appointments, cancels more than 24 h ahead, max 3 open bookings.</text>
<text x='20' y='430' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#4b5563'>Threat generation: every grey cell done by anyone is elevation of privilege; every green or amber cell that</text>
<text x='20' y='448' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#4b5563'>a legitimate actor cannot complete is denial of service. Elevation also covers breaking the rules of an amber cell.</text>
