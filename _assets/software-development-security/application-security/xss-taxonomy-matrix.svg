<svg xmlns='http://www.w3.org/2000/svg' width='900' height='520' viewBox='0 0 900 520' role='img' aria-label='XSS taxonomy matrix'>
<title>XSS taxonomy: where the payload is stored or reflected, and where the unsafe code runs</title>
<rect width='900' height='520' fill='#ffffff'/>
<text x='450.0' y='32' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='18' font-weight='bold' fill='#111827'>XSS taxonomy (OWASP server and client XSS matrix)</text>
<text x='390.0' y='76' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111827'>Server XSS</text>
<text x='390.0' y='96' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#4b5563'>server inserts data into the HTML response</text>
<text x='710.0' y='76' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111827'>Client XSS</text>
<text x='710.0' y='96' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#4b5563'>browser JavaScript writes data into the DOM</text>
<text x='214' y='191.0' text-anchor='end' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111827'>Stored</text>
<text x='214' y='209.0' text-anchor='end' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#4b5563'>payload saved (DB, log,</text>
<text x='214' y='225.0' text-anchor='end' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#4b5563'>localStorage)</text>
<text x='214' y='361.0' text-anchor='end' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111827'>Reflected</text>
<text x='214' y='379.0' text-anchor='end' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#4b5563'>payload in the request</text>
<text x='214' y='395.0' text-anchor='end' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#4b5563'>(URL, form, fragment)</text>
<rect x='234' y='114' width='312' height='162' rx='10' fill='#fee2e2' stroke='#9ca3af'/>
<text x='390.0' y='146' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111827'>Stored server XSS</text>
<text x='390.0' y='174' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2937'>Comment saved, later rendered</text>
<text x='390.0' y='193' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2937'>by a template without encoding.</text>
<text x='390.0' y='212' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2937'>Classic stored XSS (Type II).</text>
<text x='390.0' y='260' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' font-style='italic' fill='#374151'>Fix: context-aware output encoding</text>
<rect x='554' y='114' width='312' height='162' rx='10' fill='#fef3c7' stroke='#9ca3af'/>
<text x='710.0' y='146' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111827'>Stored client XSS</text>
<text x='710.0' y='174' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2937'>JSON from API or localStorage</text>
<text x='710.0' y='193' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2937'>written to innerHTML by</text>
<text x='710.0' y='212' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2937'>front-end code.</text>
<text x='710.0' y='260' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' font-style='italic' fill='#374151'>Fix: safe DOM sinks, Trusted Types</text>
<rect x='234' y='284' width='312' height='162' rx='10' fill='#dbeafe' stroke='#9ca3af'/>
<text x='390.0' y='316' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111827'>Reflected server XSS</text>
<text x='390.0' y='344' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2937'>Search term echoed into the</text>
<text x='390.0' y='363' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2937'>results page by the server.</text>
<text x='390.0' y='382' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2937'>Classic reflected XSS (Type I).</text>
<text x='390.0' y='430' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' font-style='italic' fill='#374151'>Fix: context-aware output encoding</text>
<rect x='554' y='284' width='312' height='162' rx='10' fill='#dcfce7' stroke='#9ca3af'/>
<text x='710.0' y='316' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='bold' fill='#111827'>Reflected client XSS</text>
<text x='710.0' y='344' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2937'>location.hash or query read</text>
<text x='710.0' y='363' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2937'>by JavaScript into innerHTML.</text>
<text x='710.0' y='382' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1f2937'>Classic DOM-based XSS (Type 0).</text>
<text x='710.0' y='430' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='12' font-style='italic' fill='#374151'>Fix: safe DOM sinks, Trusted Types</text>
<text x='30' y='504' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>Based on OWASP, Types of Cross-Site Scripting (server XSS vs client XSS, D. Wichers 2012). Defense in depth for all four: strict CSP, HttpOnly cookies.</text>
</svg>
