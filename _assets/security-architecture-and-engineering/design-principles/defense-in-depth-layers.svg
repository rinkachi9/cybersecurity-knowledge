<svg xmlns='http://www.w3.org/2000/svg' width='900' height='640' viewBox='0 0 900 640' role='img' aria-label='Defense in depth layers'>
<title>Defense in depth: nested control layers around the data</title>
<rect width='900' height='640' fill='#ffffff'/>
<text x='450.0' y='30' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='18' font-weight='bold' fill='#111827'>Defense in depth: nested, independent control layers</text>
<circle cx='330' cy='340' r='290' fill='#fef3c7' stroke='#374151' stroke-width='1.2'/>
<circle cx='330' cy='340' r='252' fill='#fde68a' stroke='#374151' stroke-width='1.2'/>
<circle cx='330' cy='340' r='214' fill='#bfdbfe' stroke='#374151' stroke-width='1.2'/>
<circle cx='330' cy='340' r='176' fill='#93c5fd' stroke='#374151' stroke-width='1.2'/>
<circle cx='330' cy='340' r='138' fill='#a7f3d0' stroke='#374151' stroke-width='1.2'/>
<circle cx='330' cy='340' r='100' fill='#6ee7b7' stroke='#374151' stroke-width='1.2'/>
<circle cx='330' cy='340' r='62' fill='#fca5a5' stroke='#374151' stroke-width='1.2'/>
<text x='330' y='72' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#111827'>Policies, procedures, awareness</text>
<text x='330' y='110' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#111827'>Physical security</text>
<text x='330' y='148' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#111827'>Perimeter</text>
<text x='330' y='186' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#111827'>Network</text>
<text x='330' y='224' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#111827'>Host</text>
<text x='330' y='262' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#111827'>Application</text>
<text x='330' y='345' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#111827'>Data</text>
<text x='640' y='80' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#111827'>Layer and example controls</text>
<rect x='640' y='96' width='16' height='16' fill='#fef3c7' stroke='#374151'/>
<text x='664' y='110' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#111827'>Policies, procedures, awareness</text>
<text x='664' y='128' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#374151'>people</text>
<rect x='640' y='158' width='16' height='16' fill='#fde68a' stroke='#374151'/>
<text x='664' y='172' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#111827'>Physical security</text>
<text x='664' y='190' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#374151'>badge doors, cameras, locked racks</text>
<rect x='640' y='220' width='16' height='16' fill='#bfdbfe' stroke='#374151'/>
<text x='664' y='234' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#111827'>Perimeter</text>
<text x='664' y='252' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#374151'>edge firewall, WAF, email gateway</text>
<rect x='640' y='282' width='16' height='16' fill='#93c5fd' stroke='#374151'/>
<text x='664' y='296' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#111827'>Network</text>
<text x='664' y='314' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#374151'>segmentation, ACLs, IDS/IPS</text>
<rect x='640' y='344' width='16' height='16' fill='#a7f3d0' stroke='#374151'/>
<text x='664' y='358' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#111827'>Host</text>
<text x='664' y='376' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#374151'>hardening, EDR, patching</text>
<rect x='640' y='406' width='16' height='16' fill='#6ee7b7' stroke='#374151'/>
<text x='664' y='420' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#111827'>Application</text>
<text x='664' y='438' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#374151'>input validation, authn, authz</text>
<rect x='640' y='468' width='16' height='16' fill='#fca5a5' stroke='#374151'/>
<text x='664' y='482' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#111827'>Data</text>
<text x='664' y='500' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#374151'>encryption, least privilege, backups</text>
<text x='640' y='560' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#374151'>Each layer should prevent, detect or</text>
<text x='640' y='576' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#374151'>limit an attack on its own. Layers that</text>
<text x='640' y='592' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#374151'>share a credential or a single point of</text>
<text x='640' y='608' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#374151'>failure count as one layer.</text>
</svg>
